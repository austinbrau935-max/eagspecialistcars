<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAGspecialistcars Tracking</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:#fff}
header{background:#111;padding:22px;font-size:25px;font-weight:bold}
header span{color:#e11}
.hero{text-align:center;padding:60px 20px}
h1{font-size:40px}
.tracking{max-width:650px;margin:30px auto}
input{width:100%;padding:18px;box-sizing:border-box;border:0;border-radius:10px;font-size:17px;margin-bottom:12px}
button{width:100%;padding:18px;background:#e11;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:bold}
#result{display:none;max-width:650px;margin:25px auto;background:#fff;color:#111;padding:25px;border-radius:12px;text-align:left}
.row{padding:13px 0;border-bottom:1px solid #ddd}
.status{color:green;font-weight:bold}
</style>
</head>

<body>

<header><span>EAG</span>specialistcars</header>

<section class="hero">

<div style="font-size:50px">🚚</div>

<h1>TRACK YOUR VEHICLE / SHIPMENT</h1>

<p>Enter your tracking number below to get your shipment status.</p>

<div class="tracking">

<input id="trackingNumber" placeholder="Enter your tracking number">

<button onclick="trackShipment()">TRACK</button>

</div>

<div id="result">

<h2>Shipment Tracking</h2>

<div class="row"><b>Tracking Number:</b> <span id="number"></span></div>
<div class="row"><b>Customer:</b> <span id="customer"></span></div>

<div class="row"><b>Vehicle:</b> <span id="vehicle"></span></div>

<div class="row"><b>Pickup:</b> <span id="pickup"></span></div>

<div class="row"><b>Destination:</b> <span id="destination"></span></div>

<div class="row"><b>Current Location:</b> <span id="currentLocation"></span></div>

<div class="row"><b>Status:</b> <span id="status" class="status"></span></div>

<div class="row"><b>Estimated Delivery:</b> <span id="estimatedDelivery"></span></div>
</div>

</section>

<script>

const SUPABASE_URL = "https://irnmovwfxnbesaqbfwap.supabase.co";
const SUPABASE_KEY = "sb_publishable_ndH12YWeY7NaO5TYiL9Ayw_IXbRebMF";

async function trackShipment() {

    const number = document
        .getElementById("trackingNumber")
        .value
        .trim()
        .toUpperCase();

    if (!number) {
        alert("Please enter your tracking number.");
        return;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/shipments?tracking_number=eq.${encodeURIComponent(number)}&select=*`,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            console.error(data);
            alert("Unable to check tracking information.");
            return;
        }

        if (data.length === 0) {
            alert("Tracking number not found.");
            document.getElementById("result").style.display = "none";
            return;
        }

        const shipment = data[0];

        document.getElementById("number").innerText =
            shipment.tracking_number || "";

        document.getElementById("customer").innerText =
            shipment.customer_name || "";

        document.getElementById("vehicle").innerText =
            shipment.vehicle || "";

        document.getElementById("pickup").innerText =
            shipment.pickup_location || "";

        document.getElementById("destination").innerText =
            shipment.destination || "";

        document.getElementById("currentLocation").innerText =
            shipment.current_location || "";

        document.getElementById("status").innerText =
            shipment.status || "";

        document.getElementById("estimatedDelivery").innerText =
            shipment.estimated_delivery || "";

        document.getElementById("result").style.display = "block";

    } catch (error) {

        console.error(error);
        alert("Something went wrong while checking the tracking number.");

    }
}

</script>

</body>
</html>
